# .github/workflows/build.yml
name: Build MyMauiBlazorApp for iOS v1

on:
  push:
    branches: [ ios-build ]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore NuGet packages
        run: dotnet restore Promise.sln

      - name: Publish MAUI iOS App
        run: dotnet publish Promise.Native/Promise.Native.csproj -c Release -f net10.0-ios /p:RuntimeIdentifier=ios-arm64 --no-restore
