# .github/workflows/build.yml
name: Build MAUI Promise Native App for iOS

on:
  push:
    branches: [ ios-deploy ]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore NuGet packages
        run: dotnet restore Promise.Native/Promise.Native.csproj -p:RuntimeIdentifier=ios-arm64

      - name: Publish MAUI iOS App
        run: dotnet publish Promise.Native/Promise.Native.csproj -c Release -f net10.0-ios -r ios-arm64 --no-restore

    